name: CYNERA CI

on:
  push:
    branches: [main, security/admin-otp-hardening, fix/cynera-dashboard-api-and-aiops, feature/cynera-full-demo-and-service-hardening]
  pull_request:
    branches: [main, security/admin-otp-hardening, fix/cynera-dashboard-api-and-aiops]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend API and security tests
    runs-on: ubuntu-latest
    env:
      TESTING: "true"
      APP_ENV: development
      JWT_SECRET_KEY: "ci-only-jwt-secret-not-for-production-123456789"
      OTP_HASH_SECRET: "ci-only-otp-hmac-secret-at-least-32-bytes"
      COLLECTOR_AUTH_SECRET: "ci-only-collector-secret"
      COLLECTOR_CREDENTIAL: "ci-only-collector-credential"
      DATABASE_URL: ""
      SUPABASE_DB_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            collector/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

  collector-tests:
    name: Collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt
      - name: Run collector tests
        run: python -m pytest collector/tests -q

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
