version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CYNERA
      - DATABASE_URL=sqlite:///./cynera_saas.db
      - JWT_SECRET=cynera-2026-super-secret-jwt-key-98127398127
      - COLLECTOR_AUTH_SECRET=secret-collector-token-01
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
