version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CYNERA
      - DATABASE_URL=sqlite:///./cynera_saas.db
      - JWT_SECRET=cynera-2026-super-secret-jwt-key-98127398127
      - COLLECTOR_AUTH_SECRET=secret-collector-token-01
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    environment:
      - COLLECTOR_ID=col-prod-core-01
      - TENANT_ID=11111111-1111-1111-1111-111111111111
      - BACKEND_URL=http://backend:8000
      - COLLECTOR_CREDENTIAL=secret-collector-token-01
    depends_on:
      - backend
    volumes:
      - ./collector/data:/app/data

